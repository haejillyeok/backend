services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: haejillyeok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haejillyeok}
      POSTGRES_USER: ${POSTGRES_USER:-haejillyeok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haejillyeok}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: haejillyeok-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "${OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "${OTEL_PROMETHEUS_HOST_PORT:-9464}:9464"
    volumes:
      - ./docker/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: haejillyeok-prometheus
    restart: unless-stopped
    depends_on:
      - otel-collector
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  tempo:
    image: grafana/tempo:latest
    container_name: haejillyeok-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:latest
    container_name: haejillyeok-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: haejillyeok-promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/haejillyeok:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: haejillyeok-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
