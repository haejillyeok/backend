name: Docker Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Deploy to the SSH host?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "deploy"
      target_tag:
        description: "Git tag to build and deploy. Leave empty with confirm_deploy=no to list recent tags."
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/haejillyeok-backend
  CONTAINER_NAME: haejillyeok-backend
  REMOTE_APP_DIR: /opt/haejillyeok/backend
  REMOTE_ENV_FILE: /opt/haejillyeok/backend/.env
  DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK || 'backend_default' }}
  APP_MODULE: be
  APP_PORT: "8000"

jobs:
  confirm:
    name: Confirm Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag list
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show selection
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          echo "confirm_deploy=$CONFIRM_DEPLOY"
          echo "target_tag=${TARGET_TAG:-<empty>}"
          echo "Recent Git tags:"
          recent_tags="$(git for-each-ref --count=20 --sort=-creatordate --format='%(refname:short)' refs/tags)"
          printf '%s\n' "${recent_tags:-<none>}"

  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: confirm
    if: ${{ inputs.confirm_deploy == 'deploy' }}
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and checkout image version tag
        id: image-tag
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          image_tag="${TARGET_TAG:-}"
          if [[ -z "$image_tag" ]]; then
            echo "::error::target_tag is required when confirm_deploy=deploy."
            exit 1
          fi
          if ! [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Git tag '$image_tag' cannot be used as a Docker image tag."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${image_tag}^{commit}" >/dev/null; then
            echo "::error::Git tag '$image_tag' was not found or does not point to a commit."
            echo "Recent Git tags:"
            recent_tags="$(git for-each-ref --count=20 --sort=-creatordate --format='%(refname:short)' refs/tags)"
            printf '%s\n' "${recent_tags:-<none>}"
            exit 1
          fi
          git checkout --detach "refs/tags/$image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "Resolved image tag: $image_tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Prepare SSH key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$DEPLOY_SSH_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Create runtime env file
        env:
          BE_DB_HOST: ${{ secrets.BE_DB_HOST }}
          BE_DB_PORT: ${{ vars.BE_DB_PORT || '5432' }}
          BE_DB_USER: ${{ secrets.BE_DB_USER }}
          BE_DB_PASSWORD: ${{ secrets.BE_DB_PASSWORD }}
          BE_DB_NAME: ${{ secrets.BE_DB_NAME }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED || 'true' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT || 'http://otel-collector:4318' }}
          OTEL_METRIC_EXPORT_INTERVAL: ${{ vars.OTEL_METRIC_EXPORT_INTERVAL || '5000' }}
        run: |
          set -euo pipefail
          {
            printf 'BE_ENV=prod\n'
            printf 'BE_DB_HOST=%s\n' "$BE_DB_HOST"
            printf 'BE_DB_PORT=%s\n' "$BE_DB_PORT"
            printf 'BE_DB_USER=%s\n' "$BE_DB_USER"
            printf 'BE_DB_PASSWORD=%s\n' "$BE_DB_PASSWORD"
            printf 'BE_DB_NAME=%s\n' "$BE_DB_NAME"
            printf 'OTEL_ENABLED=%s\n' "$OTEL_ENABLED"
            printf 'OTEL_EXPORTER_OTLP_ENDPOINT=%s\n' "$OTEL_EXPORTER_OTLP_ENDPOINT"
            printf 'OTEL_METRIC_EXPORT_INTERVAL=%s\n' "$OTEL_METRIC_EXPORT_INTERVAL"
          } > .env
          chmod 600 .env

      - name: Upload runtime env file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_SSH_PORT" "deploy@$DEPLOY_HOST" \
            "mkdir -p '$REMOTE_APP_DIR'"
          scp -i "$HOME/.ssh/deploy_key" -P "$DEPLOY_SSH_PORT" .env \
            "deploy@$DEPLOY_HOST:$REMOTE_ENV_FILE"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_SSH_PORT" "deploy@$DEPLOY_HOST" \
            "chmod 600 '$REMOTE_ENV_FILE'"

      - name: Deploy container over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_SSH_PORT" "deploy@$DEPLOY_HOST" bash -s <<EOF
          set -euo pipefail
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker network inspect "$DOCKER_NETWORK" >/dev/null
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            -e APP_MODULE="$APP_MODULE" \
            -e PORT="$APP_PORT" \
            -v "$REMOTE_ENV_FILE:/app/.env:ro" \
            -p "$APP_PORT:$APP_PORT" \
            "$IMAGE_NAME:$IMAGE_TAG"
          docker ps --filter "name=$CONTAINER_NAME"
          EOF
