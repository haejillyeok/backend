[tools]
python = "3.11"

[hooks]
enter = "mise run infra-up"

[tasks.venv]
description = "프로젝트 가상환경을 생성합니다"
run = "python -m venv .venv"

[tasks.install]
description = ".venv에 Python 의존성을 설치합니다"
depends = ["venv"]
run = ".venv/bin/python -m pip install -e '.[dev]'"


[tasks.dev-be]
description = "백엔드 REST API 개발 서버를 실행합니다"
depends = ["install"]
run = ".venv/bin/uvicorn app.be.main:app --reload --port ${BE_HTTP_PORT:-8000}"

[tasks.dev-agent]
description = "에이전트 REST API 개발 서버를 실행합니다"
depends = ["install"]
run = ".venv/bin/uvicorn app.agent.main:app --reload --port ${AGENT_HTTP_PORT:-8001}"

[tasks.test]
description = "Python 테스트를 실행합니다"
depends = ["install"]
run = ".venv/bin/python -m pytest"

[tasks.generate-postman]
description = "BE Postman collection과 local environment JSON을 생성합니다"
depends = ["venv"]
run = ".venv/bin/python scripts/generate_postman.py"

[tasks.format]
description = "Python 코드 포맷을 적용합니다"
depends = ["install"]
run = ".venv/bin/python -m ruff format app test migrations"

[tasks.format-check]
description = "Python 코드 포맷 상태를 확인합니다"
depends = ["install"]
run = ".venv/bin/python -m ruff format --check app test migrations"

[tasks.db-revision]
description = "Alembic autogenerate로 새 DB migration revision을 생성합니다"
depends = ["install"]
run = ".mise/scripts/db-revision"

[tasks.db-upgrade]
description = "지정한 Alembic revision까지 DB migration을 적용합니다"
depends = ["install"]
run = ".venv/bin/python -m alembic upgrade"

[tasks.db-upgrade-head]
description = "DB migration을 최신 Alembic revision까지 적용합니다"
depends = ["install"]
run = ".venv/bin/python -m alembic upgrade head"

[tasks.db-downgrade]
description = "지정한 Alembic revision까지 DB migration을 되돌립니다"
depends = ["install"]
run = ".venv/bin/python -m alembic downgrade"

[tasks.db-downgrade-one]
description = "DB migration을 바로 이전 Alembic revision으로 되돌립니다"
depends = ["install"]
run = ".venv/bin/python -m alembic downgrade -1"

[tasks.db-current]
description = "현재 DB에 적용된 Alembic revision을 확인합니다"
depends = ["install"]
run = ".venv/bin/python -m alembic current"

[tasks.db-history]
description = "Alembic migration revision 이력을 확인합니다"
depends = ["install"]
run = ".venv/bin/python -m alembic history"

[tasks.infra-up]
description = "PostgreSQL, OpenTelemetry Collector, Prometheus, Tempo, Loki, Promtail, Grafana를 시작합니다"
run = "docker compose up -d postgres otel-collector prometheus tempo loki promtail grafana"

[tasks.infra-down]
description = "로컬 인프라를 중지합니다"
run = "docker compose down"

[tasks.infra-logs]
description = "로컬 인프라 로그를 실시간으로 확인합니다"
run = "docker compose logs -f postgres otel-collector prometheus tempo loki promtail grafana"

[tasks.load-test-up]
description = "k6 부하테스트용 로컬 스택을 빌드하고 시작합니다"
run = "docker compose --env-file .env.load-test -f docker-compose.yml -f docker-compose.load-test.yml up -d --build postgres otel-collector prometheus tempo loki promtail grafana be-loadtest k6-coordinator"

[tasks.load-test-down]
description = "k6 부하테스트용 로컬 스택을 중지합니다"
run = "docker compose --env-file .env.load-test -f docker-compose.yml -f docker-compose.load-test.yml down"

[tasks.load-test-logs]
description = "k6 부하테스트용 로컬 스택 로그를 실시간으로 확인합니다"
run = "docker compose --env-file .env.load-test -f docker-compose.yml -f docker-compose.load-test.yml logs -f postgres otel-collector prometheus grafana be-loadtest k6-coordinator"

[tasks.load-test-word-fixture]
description = "k6 끝말잇기 valid word fixture를 생성합니다"
depends = ["install"]
run = ".venv/bin/python scripts/generate_k6_word_fixture.py"

[tasks.load-test-seed-valid-words]
description = "word_game.valid_words에 끝말잇기 기본 단어 seed를 적재합니다"
run = "docker compose --env-file .env.load-test -f docker-compose.yml -f docker-compose.load-test.yml exec -T postgres sh -c 'psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"' < scripts/valid_words_seed.sql"

[tasks.load-test-db-word-check]
description = "DB에 k6 끝말잇기 실행용 active word_chain 단어가 적재됐는지 확인합니다"
depends = ["install"]
run = ".venv/bin/python scripts/k6_db_word_check.py --env-file .env.load-test"

[tasks.load-test-preflight]
description = "k6 부하테스트 실행 전 파일, 환경변수, Docker 상태를 확인합니다"
depends = ["install"]
run = ".venv/bin/python scripts/k6_preflight.py --env-file .env.load-test"

[tasks.load-test-stack-check]
description = "실행 중인 k6 부하테스트 스택의 health endpoint를 확인합니다"
depends = ["install"]
run = ".venv/bin/python scripts/k6_stack_check.py"

[tasks.load-test-prometheus-check]
description = "testid 기준으로 k6 remote-write 지표가 Prometheus에 들어왔는지 확인합니다"
depends = ["install"]
run = ".venv/bin/python scripts/k6_prometheus_check.py"

[tasks.load-test-smoke]
description = "k6 smoke E2E 부하테스트를 실행합니다"
depends = ["install"]
run = ".venv/bin/python scripts/run_k6_load_test.py smoke --env-file .env.load-test"

[tasks.load-test-ramp]
description = "k6 ramp E2E 부하테스트를 실행합니다"
depends = ["install"]
run = ".venv/bin/python scripts/run_k6_load_test.py ramp --env-file .env.load-test"

[tasks.load-test-soak50]
description = "k6 50 VU soak E2E 부하테스트를 실행합니다"
depends = ["install"]
run = ".venv/bin/python scripts/run_k6_load_test.py soak50 --env-file .env.load-test"

[tasks.load-test-soak100]
description = "k6 100 VU soak E2E 부하테스트를 실행합니다"
depends = ["install"]
run = ".venv/bin/python scripts/run_k6_load_test.py soak100 --env-file .env.load-test"

[tasks.load-test-result]
description = "k6 부하테스트 결과 기록 템플릿을 생성합니다"
depends = ["install"]
run = ".venv/bin/python scripts/k6_result_template.py"
