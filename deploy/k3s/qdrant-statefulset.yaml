apiVersion: v1
kind: PersistentVolume
metadata:
  name: qdrant-data-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: qdrant-local
  local:
    path: /var/lib/shiritori/qdrant
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: shiritori-role
              operator: In
              values:
                - agent-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: shiritori-agent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qdrant-local
  resources:
    requests:
      storage: 20Gi
  volumeName: qdrant-data-pv
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: shiritori-agent
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      nodeSelector:
        shiritori-role: agent-storage
      terminationGracePeriodSeconds: 60
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.18.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
